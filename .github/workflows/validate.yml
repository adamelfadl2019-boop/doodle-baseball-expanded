name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check launcher syntax
        run: python -m py_compile launcher.py

      - name: Check runtime JavaScript syntax
        run: node --check payload/dbe-mod.js

      - name: Validate DBE data and public files
        run: python tools/validate_release.py
