name: Feature request
description: Suggest an improvement or new idea for Doodle Baseball Expanded.
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature ideas are welcome. Quality and gameplay value matter more than adding features just to increase the feature count.

  - type: input
    id: summary
    attributes:
      label: Feature summary
      description: Give the idea a short name or one-sentence summary.
      placeholder: "Example: Weekly rotating challenge"
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How should it work?
      description: Explain the gameplay or behavior you want.
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: Why would this improve the mod?
      description: What problem does it solve or what makes it fun?
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Rough size
      options:
        - Small polish / quality-of-life change
        - Medium feature
        - Large system or mode
        - Not sure
    validations:
      required: true
