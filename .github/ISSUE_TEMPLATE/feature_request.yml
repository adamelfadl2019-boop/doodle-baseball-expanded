name: Feature request
description: Suggest something that would make the mod better.
title: "[IDEA] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. The project is intentionally prioritizing quality over adding features just to make the list longer.

  - type: input
    id: summary
    attributes:
      label: Short version
      placeholder: "Weekly rotating challenge"
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How would it work?
      description: Explain what the player would actually do or see.
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: Why would it make the mod better?
      description: What problem does it solve, or what makes it fun?
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Rough size
      options:
        - Small polish / quality-of-life
        - Medium feature
        - Large mode / system
        - Not sure
    validations:
      required: true
