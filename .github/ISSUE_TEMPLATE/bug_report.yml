name: Bug report
description: Something broke? Tell me exactly what happened.
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it.
        If the game still opens, press **F9** first and include the generated debug information when possible.

  - type: input
    id: version
    attributes:
      label: DBE version
      placeholder: "V19 / v19.0.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Launcher / installation
        - Normal gameplay
        - Pitch / variant
        - Defense / foul / wall
        - Game mode
        - UI / display
        - Debug tools
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What were you trying to do?
      placeholder: "I selected Boss Ladder and..."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What actually happened?
      placeholder: "Instead, the game..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can I reproduce it?
      placeholder: |
        1. Start the mod
        2. Select...
        3. Wait for...
        4. Bug happens
    validations:
      required: true

  - type: textarea
    id: debug
    attributes:
      label: F9 report / DBE_LAST_ERROR.txt
      description: Paste useful debug/error text here.
      render: text

  - type: input
    id: system
    attributes:
      label: Browser and operating system
      placeholder: "Edge / Windows 11"

  - type: checkboxes
    id: checks
    attributes:
      label: Quick checks
      options:
        - label: I tested the current release or explained why I could not.
        - label: I checked for an existing issue about the same bug.
