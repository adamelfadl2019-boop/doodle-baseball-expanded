<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBE V19 — 3,000 Pitch Encyclopedia</title><style>body{margin:0;background:#081018;color:#eef7ff;font:13px system-ui}.top{position:sticky;top:0;background:#0d1824f4;padding:16px;border-bottom:1px solid #ffffff18;z-index:2}h1{margin:0}.sub{font-size:11px;color:#9fb0c2;margin:5px 0 10px}.filters{display:grid;grid-template-columns:1fr 170px 150px;gap:7px}input,select{background:#111c28;color:white;border:1px solid #ffffff20;border-radius:9px;padding:9px}option{color:#000}#count{font-size:10px;color:#69dcff;margin-top:8px}main{max-width:1050px;margin:auto;padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.card{border:1px solid #ffffff12;background:#ffffff07;border-radius:12px;padding:10px}.name{font-weight:900}.meta{font-size:9px;color:#8fa3b5;margin-top:3px}.desc{font-size:10px;color:#c1cdd8;line-height:1.45;margin-top:6px}.sig{font-size:9px;color:#69dcff;margin-top:5px}@media(max-width:700px){main,.filters{grid-template-columns:1fr}}</style></head><body><div class="top"><h1>⚾ DBE V19 — 3,000 Named Pitches</h1><div class="sub">Search the complete pitch identity catalog used by the mod.</div><div class="filters"><input id="q" placeholder="Magic Zoomball, Black Hole, fastball…"><select id="cat"><option value="">All worlds</option></select><select id="style"><option value="">All styles</option></select></div><div id="count">Loading…</div></div><main id="list"></main><script>let all=[];const q=document.querySelector('#q'),cat=document.querySelector('#cat'),style=document.querySelector('#style'),list=document.querySelector('#list'),count=document.querySelector('#count');fetch('data/pitches.json').then(r=>r.json()).then(d=>{all=d;for(const x of [...new Set(all.map(p=>p.category))].sort())cat.insertAdjacentHTML('beforeend',`<option>${x}</option>`);for(const x of [...new Set(all.map(p=>p.style))].sort())style.insertAdjacentHTML('beforeend',`<option>${x}</option>`);draw()});function draw(){const s=q.value.trim().toLowerCase();const a=all.filter(p=>(!s||(`${p.id} ${p.name} ${p.desc} ${p.theme} ${p.form}`).toLowerCase().includes(s))&&(!cat.value||p.category===cat.value)&&(!style.value||p.style===style.value));count.textContent=`${a.length.toLocaleString()} / 3,000 pitches`;list.innerHTML=a.slice(0,500).map(p=>`<article class="card"><div class="name">#${p.id} ${p.icon||'⚾'} ${p.name}</div><div class="meta">${p.category} • ${p.theme} • ${p.style}</div><div class="desc">${p.desc}</div><div class="sig">Speed ${p.speed} • timing ${p.center} • window ${p.window}</div></article>`).join('')+(a.length>500?'<div class="sub">Showing first 500 matches. Narrow the search to inspect more.</div>':'')}q.oninput=draw;cat.onchange=draw;style.onchange=draw;</script></body></html>
